[project]
name = "decorative-crossword"
version = "0.1.0"
description = "Offline crossword grid generator: fills a grid from a word bank"
readme = "README.md"
license = "AGPL-3.0-or-later"
# The oldest runtime this tool supports, deliberately below the one it is developed on: a
# newer target silently accepts syntax and APIs that crash on an older one. It is also the
# lowest this tool runs on: the density advice formats an exact Fraction with a float-style
# format such as ".1f", which Fraction accepts only from 3.12. Supporting 3.12 is paid for
# in the code rather than left as a trap: cw_emit checks sys.platform and never calls
# os.fchmod on Windows, where it arrived only in 3.13 (and where there are no POSIX mode
# bits to carry on any version), and the help formatter leaves off the default argparse
# stamps onto a required option before 3.13.
requires-python = ">=3.12"
# Deliberately empty: the tool is standard library only.
dependencies = []

[project.optional-dependencies]
# The property tests. Tests only: nothing at runtime imports it.
test = ["hypothesis==6.165.10"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# E4/E7/E9/F are ruff's classic default set, written out so the enabled rules are a
# function of this file rather than of whichever ruff release is installed. PGH003 and
# PGH004 flag a bare `# type: ignore` or `# noqa`, one that names no rule code. D adds the
# docstring rules (pep257), minus D401's imperative-mood opinion, which flags valid
# noun-phrase summaries.
select = ["E4", "E7", "E9", "F", "PGH003", "PGH004", "D"]
ignore = ["D401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Test method names say what each test does; a docstring per test would be noise.
"**/test_*.py" = ["D"]

[tool.mypy]
# Held to requires-python above: mypy judges which standard-library names exist from this
# key alone, so the two must agree for the floor to be type-checked at all.
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
# The entry point and the tests import src/'s modules, the vendored stdio library and the
# property strategies by bare name, after putting their folders on sys.path at runtime;
# mypy cannot see a runtime sys.path insert, so it is told here.
mypy_path = [
  "$MYPY_CONFIG_FILE_DIR/stdio_utf8",
  "$MYPY_CONFIG_FILE_DIR/src",
  "$MYPY_CONFIG_FILE_DIR/property_strategies",
]

[tool.coverage.report]
# `# pragma: only-on posix` marks a line only a POSIX host runs, and
# `# pragma: only-on win32` one only Windows runs. Each is excluded on the other kind of
# host alone, so both stay measured where they run. coverage.py's configuration can read
# environment variables but not the platform, so it keys on OS: Windows sets it to
# Windows_NT in every process and POSIX systems leave it unset, so a set OS reads as
# Windows. With OS unset, ${OS-} is empty: the first pattern ends in (?!), which never
# matches, and the second is plain. With OS set, the first matches, and the second would
# need "win32" to run straight into "Windows_NT" across a word boundary, which cannot
# happen. exclude_also adds to coverage.py's default patterns, so `# pragma: no cover`
# keeps working.
exclude_also = [
  'pragma:\s*only-on\s+posix\b(?!${OS-})',
  'pragma:\s*only-on\s+win32\b${OS-}',
]

# The tables below configure the gates run over this tree before it is published. They are
# inert for anyone who only runs the tool or its tests. The same gates read the few waivers
# in the source, comments of the form `# prose: ignore[...]` or `# reliability: ignore[...]`,
# each stating its reason on the line; a gate that needs no setting has no table here.

[tool.pii_scan]
# The license names its copyright holder, which is its purpose.
exclude = ["LICENSE"]

[tool.samples_presence]
# Neither turns an input into an output: a strategy library and a stdio library.
exempt = ["property_strategies", "stdio_utf8"]

[tool.stdio_policy]
# The whole tree, the vendored stdio library included.
paths = ["."]

[tool.dep_audit]
# Pinning checks only in the inner loop; the network audit is run on demand.
offline = "skip"

# prose: ignore[fuzz_gate] the table this gate reads, named for it
[tool.fuzz_gate]
# Falsifying inputs land beside the tests that found them.
corpus_dir = "tests/fuzz_corpus"

# prose: ignore[cli_doc_consistency] the table this gate reads, named for it
[tool.cli_doc_consistency]
# README.md is the user guide and --help the option reference; no companion doc ships.
exclude = ["decorative_crossword.py"]

# prose: ignore[claim_check] the table this gate reads, named for it
[tool.claim_check.bases]
# The documents here cite paths from this repository's root, the directory every command
# they print is run from, even when the document itself sits lower: samples/README.md
# names tests/ files. "." adds this file's own directory as a resolution root for every
# document under it, so a citation resolves wherever the checker's own root is taken to be.
"." = ["."]

[tool.context_budget]
# Budgets the instruction files a coding assistant loads at the start of a session. This
# repository carries none, so the table declares no subjects: the check then has a
# declaration to read, and measures nothing.

[tool.prose_terms]
# Words this project's prose must not use, so they cannot creep back in. The first would
# name who decided something, which a reason never needs: state the reason, and call
# whoever runs the tool "the operator". The rest name a standards file, a notes folder and
# the gate tools this project was developed beside, none of which is in this repository,
# so a sentence that leans on one explains nothing to its reader: state the rule itself,
# with a reason anyone can check. Code is read as well as prose, so a local that happens
# to share one of these spellings is waived on its own line, with the reason. Each entry
# waives itself: the declaration is not prose.
terms = [
  # prose: ignore[owner] the declaration itself
  "owner",
  # prose: ignore[AGENTS] the declaration itself
  "AGENTS",
  # prose: ignore[technical_notes] the declaration itself
  "technical_notes",
  # prose: ignore[python_gate] the declaration itself
  "python_gate",
  # prose: ignore[check_all] the declaration itself
  "check_all",
  # prose: ignore[claim_check] the declaration itself
  "claim_check",
  # prose: ignore[cli_doc_consistency] the declaration itself
  "cli_doc_consistency",
  # prose: ignore[fuzz_gate] the declaration itself
  "fuzz_gate",
  # prose: ignore[file_length] the declaration itself
  "file_length",
  # prose: ignore[reliability_lint] the declaration itself
  "reliability_lint",
  # prose: ignore[pyproject_lint] the declaration itself
  "pyproject_lint",
  # prose: ignore[folder_layout] the declaration itself
  "folder_layout",
]
